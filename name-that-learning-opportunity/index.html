<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Name That Learning Opportunity</title>
    <meta
      name="description"
      content="A presenter-controlled TCEA Lunch and Learn game show activity."
    >
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Game controls and progress">
        <div class="brand-lockup">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>TCEA Lunch and Learn</span>
        </div>
        <div class="topbar-actions">
          <span class="progress-chip" id="progressChip">Round 1 of 9</span>
          <button class="restart-button" type="button" id="homeButton">
            Restart
          </button>
        </div>
      </header>

      <main class="screen" id="screen" aria-live="polite"></main>
    </div>

    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

    <script src="script.js"></script>
  </body>
</html>
