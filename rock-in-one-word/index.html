<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rock in One Word</title>
    <link rel="stylesheet" href="style.css?v=rock-in-one-word-20260811i">
  </head>
  <body>
    <div class="stage-glow" aria-hidden="true"></div>
    <img class="guitar-art" src="assets/pdf-pink-guitar.png" alt="Pink electric guitar graphic from the original quiz PDF">
    <img class="notes-art" src="assets/pdf-music-notes.png" alt="White music note graphic from the original quiz PDF">

    <div id="app" class="app-shell"></div>

    <dialog id="sourcesDialog" class="modal">
      <div class="modal-panel">
        <button class="icon-button close-dialog" type="button" data-action="close-sources" aria-label="Close sources">x</button>
        <h2>Sources & About</h2>
        <p>
          Visual direction comes from the original PDF: black background, hot pink guitar,
          white/pink typography, pick logo, and music-note accents. The guitar, pick, and
          note strip were cropped as individual motifs from the PDF render.
        </p>
        <div id="sourcesList" class="sources-list"></div>
      </div>
    </dialog>

    <script src="script.js?v=rock-in-one-word-20260811i"></script>
  </body>
</html>
