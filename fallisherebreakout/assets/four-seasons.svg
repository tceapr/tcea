<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Four Seasons</title>
  <desc id="desc">A classroom graphic explaining spring, summer, fall, and winter.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf3"/>
      <stop offset="1" stop-color="#ffd77c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5b3217" flood-opacity=".18"/>
    </filter>
    <style>
      .title { font: 900 98px Arial, Helvetica, sans-serif; fill: #341707; }
      .subtitle { font: 800 32px Arial, Helvetica, sans-serif; fill: #5a331a; }
      .season-title { font: 900 54px Arial, Helvetica, sans-serif; fill: #221006; }
      .season-text { font: 800 33px Arial, Helvetica, sans-serif; fill: #2d1a10; }
      .small-label { font: 900 23px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .panel { stroke: rgba(74,43,22,.42); stroke-width: 6; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <path d="M0 0h1600v1000H0z" fill="none" stroke="#f18b21" stroke-width="24"/>
  <path d="M48 48h1504v904H48z" fill="none" stroke="#c6541c" stroke-width="5" stroke-dasharray="18 12"/>

  <text x="800" y="112" text-anchor="middle" class="title">The Four Seasons</text>
  <text x="800" y="160" text-anchor="middle" class="subtitle">Spring, summer, fall, and winter repeat in a yearly cycle.</text>

  <g transform="translate(88 205)">
    <rect class="panel" width="680" height="320" rx="24" fill="#d8ffbf"/>
    <circle cx="82" cy="76" r="38" fill="#ffe044"/>
    <g transform="translate(144 118)">
      <path d="M0 -62c31 14 34 48 0 70-34-22-31-56 0-70z" fill="#ff4fa1"/>
      <path d="M44 -38c14 31-7 58-47 52-7-40 16-62 47-52z" fill="#ff6eb5"/>
      <path d="M44 28c-16 30-50 31-69-6 24-32 55-27 69 6z" fill="#ff4fa1"/>
      <path d="M-44 28c14-33 46-38 70-6-20 37-54 36-70 6z" fill="#ff6eb5"/>
      <path d="M-44 -38c31-10 54 12 47 52-40 6-61-21-47-52z" fill="#ff4fa1"/>
      <circle r="22" fill="#ffd447" stroke="#b87812" stroke-width="6"/>
    </g>
    <path d="M144 168c-6 64-54 86-82 67" fill="none" stroke="#239b32" stroke-width="16" stroke-linecap="round"/>
    <path d="M91 184c28-16 56-10 80 20-30 18-58 12-80-20z" fill="#33c34a"/>
    <text x="238" y="74" class="season-title">Spring</text>
    <text x="238" y="133" class="season-text">Warmer days return.</text>
    <text x="238" y="181" class="season-text">Flowers bloom.</text>
    <text x="238" y="229" class="season-text">New leaves grow.</text>
    <rect x="486" y="34" width="148" height="48" rx="24" fill="#15983b"/>
    <text x="560" y="64" text-anchor="middle" class="small-label">NEW LIFE</text>
  </g>

  <g transform="translate(832 205)">
    <rect class="panel" width="680" height="320" rx="24" fill="#ffe46a"/>
    <circle cx="112" cy="96" r="62" fill="#ff9f00"/>
    <g stroke="#ff9f00" stroke-width="16" stroke-linecap="round">
      <path d="M112 18v28"/><path d="M112 146v28"/><path d="M34 96h28"/><path d="M162 96h28"/>
      <path d="M58 42l20 20"/><path d="M166 42l-20 20"/><path d="M58 150l20-20"/><path d="M166 150l-20-20"/>
    </g>
    <path d="M58 244c90-40 146-40 240 0" fill="none" stroke="#00a8cf" stroke-width="22" stroke-linecap="round"/>
    <path d="M78 268c84-34 138-34 220 0" fill="none" stroke="#ff7214" stroke-width="22" stroke-linecap="round"/>
    <text x="238" y="74" class="season-title">Summer</text>
    <text x="238" y="133" class="season-text">The days are longest.</text>
    <text x="238" y="181" class="season-text">Sunshine feels hot.</text>
    <text x="238" y="229" class="season-text">Plants keep growing.</text>
    <rect x="486" y="34" width="148" height="48" rx="24" fill="#f45f13"/>
    <text x="560" y="64" text-anchor="middle" class="small-label">SUNNY</text>
  </g>

  <g transform="translate(88 585)">
    <rect class="panel" width="680" height="320" rx="24" fill="#ffc46b"/>
    <path d="M120 68c46 34 48 86 0 126-48-40-46-92 0-126z" fill="#e82f1e"/>
    <path d="M74 110c54 10 76 58 46 112-58-18-74-64-46-112z" fill="#ff7b00"/>
    <path d="M166 112c-48 20-62 70-20 116 52-30 62-76 20-116z" fill="#9b4217"/>
    <path d="M120 86v154" stroke="#5b260d" stroke-width="15" stroke-linecap="round"/>
    <path d="M66 258c78 24 148 24 232 0" fill="none" stroke="#4d7b22" stroke-width="22" stroke-linecap="round"/>
    <text x="238" y="74" class="season-title">Fall</text>
    <text x="238" y="133" class="season-text">Cooler days arrive.</text>
    <text x="238" y="181" class="season-text">Leaves change color.</text>
    <text x="238" y="229" class="season-text">Harvest time begins.</text>
    <rect x="486" y="34" width="148" height="48" rx="24" fill="#c92e22"/>
    <text x="560" y="64" text-anchor="middle" class="small-label">HARVEST</text>
  </g>

  <g transform="translate(832 585)">
    <rect class="panel" width="680" height="320" rx="24" fill="#c8eeff"/>
    <g stroke="#168bd0" stroke-width="14" stroke-linecap="round">
      <path d="M124 54v164"/><path d="M42 136h164"/><path d="M66 78l116 116"/><path d="M182 78L66 194"/>
    </g>
    <circle cx="124" cy="136" r="25" fill="#ffffff" stroke="#168bd0" stroke-width="8"/>
    <path d="M58 258c72-28 150-28 236 0" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <path d="M68 270c68-18 142-18 216 0" fill="none" stroke="#62b9e6" stroke-width="10" stroke-linecap="round"/>
    <text x="238" y="74" class="season-title">Winter</text>
    <text x="238" y="133" class="season-text">The coldest season.</text>
    <text x="238" y="181" class="season-text">Days are shortest.</text>
    <text x="238" y="229" class="season-text">Many plants rest.</text>
    <rect x="486" y="34" width="148" height="48" rx="24" fill="#146ea8"/>
    <text x="560" y="64" text-anchor="middle" class="small-label">COLD</text>
  </g>

  <g transform="translate(800 555)">
    <circle r="64" fill="#fffdf3" stroke="#f18b21" stroke-width="10"/>
    <path d="M-22 -18c22-23 58-20 75 4" fill="none" stroke="#15983b" stroke-width="12" stroke-linecap="round"/>
    <path d="M42 -23l18 12-20 9z" fill="#15983b"/>
    <path d="M22 18c-22 23-58 20-75-4" fill="none" stroke="#f45f13" stroke-width="12" stroke-linecap="round"/>
    <path d="M-42 23l-18-12 20-9z" fill="#f45f13"/>
  </g>
</svg>
